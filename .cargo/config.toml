# Only line tables, for dependencies and for the workspace's own crates:
# backtraces keep file and line, and the dozens of test binaries (each links
# DuckDB, DataFusion and Lance) stay a fraction of their size. Dropping them
# for dependencies too was tried on 2026-11-04: it saved about 1 GB of
# libraries and nothing on the test binaries (on macOS the line tables stay
# out of the linked binary), not worth losing their lines in backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = "line-tables-only"

# Link the official prebuilt libduckdb (downloaded once into target/duckdb-download)
# instead of compiling DuckDB's C++ sources.
[env]
DUCKDB_DOWNLOAD_LIB = "1"

[build]
rustflags = ["-C", "symbol-mangling-version=v0"]

# Browser build (crates/oikome-wasm). Target rustflags replace the [build]
# ones, so the mangling flag is repeated. getrandom 0.3 needs this cfg as
# well as its `wasm_js` feature to read crypto.getRandomValues.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "symbol-mangling-version=v0", "--cfg", 'getrandom_backend="wasm_js"']

[alias]
# The one shape of each job (AGENT.md §6.2.1): always over the whole workspace,
# narrowed with --bin, --test, --lib or a name filter, never with -p, so every
# run resolves dependency features the same way and reuses one set of builds.
#   cargo node                  the `oikome` binary
#   cargo t --test api          one test file; `cargo t --lib -- sources` unit tests by name
#   cargo lint                  clippy over every target, warnings as errors
node = "build --workspace --bin oikome"
t = "test --workspace"
lint = "clippy --workspace --all-targets -- -D warnings"

check-tests = "test --no-run"
