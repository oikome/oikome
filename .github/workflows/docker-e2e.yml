# Network phase (3.1) end to end: three Oikome nodes in Docker
# (docker/compose.yml), driven by tests/e2e/docker_nodes.sh; and reaching
# across networks without a relay (3.12): two homes behind NAT routers and
# a contact (docker/nat/compose.yml), driven by tests/e2e/docker_nat.sh.
name: docker-e2e

# Runs only when the Rust core, the tests or the image change; app and
# documentation changes do not need three Docker nodes.
on:
  push:
    branches: ["main", "feat/**", "ci/**"]
    paths:
      - "crates/**"
      - "tests/**"
      - "docker/**"
      - "third_party/**"
      - "plugins/**"
      - "packages/plugin-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/docker-e2e.yml"
  # Pull requests from forks, which do not push to this repository.
  pull_request:
    branches: ["main"]
    paths:
      - "crates/**"
      - "tests/**"
      - "docker/**"
      - "third_party/**"
      - "plugins/**"
      - "packages/plugin-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/docker-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-nodes:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Build the node image
        run: docker compose -f docker/compose.yml build

      - name: Discovery, TLS, federated query, subscription, revocation, search
        run: bash tests/e2e/docker_nodes.sh
        env:
          E2E_BUILD: "0"
          E2E_LOG_DIR: e2e-logs

      - name: Build the router and NAT node images
        run: docker compose -f docker/nat/compose.yml build

      - name: Across networks, without a relay (3.12)
        run: bash tests/e2e/docker_nat.sh
        env:
          E2E_BUILD: "0"
          E2E_LOG_DIR: e2e-logs

      - name: Upload node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs/
