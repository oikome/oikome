[workspace]
members = ["crates/*", "tests", "tests/tools/data-gen"]
# Vendored third-party code is patched in below, not built as our own crate.
exclude = ["third_party/datafusion-federation"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["The Oikome Authors"]

[workspace.dependencies]
# Async runtime and utilities
# Each crate picks its tokio features: the browser build cannot use `full`.
tokio = "1"
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"

# Errors, serialization, misc
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
bitflags = "2"
tracing = "0.1"

# Arrow / Parquet / Iceberg — all pinned to the arrow 58 line.
arrow = "58"
arrow-array = "58"
arrow-schema = "58"
arrow-select = "58"
arrow-ipc = "58"
arrow-cast = { version = "58", features = ["prettyprint"] }
parquet = { version = "58", features = ["arrow", "zstd"] }
iceberg = "0.10.1"

# Federation coordinator (DataFusion 54 == arrow 58). Do NOT bump to 55 (arrow 59).
# Default features minus `compression` and `parquet`: both need C code, the
# coordinator never reads files, and the browser build cannot compile them.
datafusion = { version = "54", default-features = false, features = [
    "nested_expressions",
    "crypto_expressions",
    "datetime_expressions",
    "encoding_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
    "recursive_protection",
    "sql",
] }
datafusion-federation = { version = "=0.5.5", features = ["sql"] }
sqlparser = { version = "0.62", features = ["visitor"] }

# Engines
# Prebuilt libduckdb via DUCKDB_DOWNLOAD_LIB (.cargo/config.toml); parquet is built in.
duckdb = { version = "=1.10506.1" }
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }

# Identity and networking
ed25519-dalek = { version = "2.2", features = ["zeroize", "pkcs8"] }
getrandom = "0.3"
base64 = "0.22"
bs58 = "0.5"
blake3 = "1.8"
# Thumbnails of photos viewed in place (§7.7): decoding and resizing, only
# the formats Oikome shows.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
web-time = "1.1.0"
# Browser node (crates/oikome-wasm). wasm-bindgen is pinned exactly: the
# wasm-bindgen CLI that generates the JS glue must be the same version.
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4.58"
js-sys = "0.3.85"
# Lance manifests (crates/oikome-catalog, feature `lance`): which files make
# up one version of a dataset. Pinned to the lance release inside DuckDB
# 1.5.6's `lance` extension; protoc is built from source (`protoc`), so no
# system protobuf compiler is needed. No cloud object stores.
lance-table = { version = "=12.0.0", features = ["protoc"] }
lance-io = { version = "=12.0.0", default-features = false }
lance-file = { version = "=12.0.0", features = ["protoc"] }
lance-encoding = { version = "=12.0.0", features = ["protoc"] }
# Vector search in transactional Spaces (vec0 tables), compiled into SQLite.
sqlite-vec = "=0.1.9"
# WebRTC endpoint of a Full Node for browsers (crates/oikome-webrtc): pure
# Rust crypto (dimpl DTLS, sctp-proto), no C library.
str0m = { version = "=0.24.1", default-features = false, features = ["rust-crypto"] }
sha2 = "0.10"
zeroize = "1"
arrow-flight = "58.4"
tonic = { version = "0.14.6", features = ["tls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc", "ring"] }
libp2p = { version = "0.57.1", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "mdns", "identify", "request-response", "json", "macros", "ed25519", "relay", "dcutr"] }
# Byte streams over libp2p connections: Arrow Flight between nodes on
# different networks (3.12).
libp2p-stream = "=0.5.0-alpha"
# Ask the home router to open the node's port (3.12): UPnP IGD, and
# NAT-PMP / PCP at the default gateway.
rupnp = { version = "3.0.0", default-features = false }
crab_nat = "0.8.1"
netdev = { version = "0.46.3", default-features = false, features = ["gateway"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# User-facing apps (architecture v3 §13.4): the owner's HTTP API and the
# TypeScript types generated from it. axum is already in the tree via tonic.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
subtle = "2.6"
ts-rs = "=12.0.1"

# Dev
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-test = "0.4"

# datafusion-federation 0.5.5 turns DataFusion's default features back on;
# this copy only declares `default-features = false` (third_party/README.md).
[patch.crates-io]
datafusion-federation = { path = "third_party/datafusion-federation" }
# Resumable uploads (third_party/README.md).
opendal-service-gdrive = { path = "third_party/opendal-service-gdrive" }

# The browser node's WebAssembly (packages/node/scripts/build.sh): smallest code,
# no symbol names. Native release builds are unaffected.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
