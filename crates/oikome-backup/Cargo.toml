[package]
name = "oikome-backup"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Oikome backups: a consistent copy of the data folder in an encrypted, deduplicated restic-format repository"

[dependencies]
oikome-vfs = { path = "../oikome-vfs" }
# restic-format repositories (encrypted, deduplicated, readable by restic):
# Apache-2.0 OR MIT, checked on crates.io (0.14.0, 2026-11-17).
rustic_core = "0.14"
blake3 = { workspace = true }
bytes = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
