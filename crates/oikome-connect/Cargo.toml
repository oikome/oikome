[package]
name = "oikome-connect"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Oikome connectors: bring an app's data into a transactional Space (CSV files, flomo)"

[dependencies]
oikome-engine = { path = "../oikome-engine" }
arrow-array = { workspace = true }
arrow-csv = "58"
arrow-json = "58"
arrow-schema = { workspace = true }
parquet = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
# A file's time on this computer's clock; already in the tree (arrow).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# The same reqwest and TLS stack as oikome-vfs (and iceberg): ring.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# flomo's HTML export, read with its tokenizer (no DOM, no CSS selectors,
# which are MPL-2.0).
html5ever = "0.40"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
zeroize = { workspace = true }
# flomo_backup.zip; only reading deflated entries.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
