[package]
name = "oikome-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Oikome node runtime: session, engine registry and statement routing"

[features]
default = ["engine-duckdb", "engine-sqlite"]
engine-duckdb = ["dep:oikome-engine-duckdb"]
engine-sqlite = ["dep:oikome-engine-sqlite"]

[dependencies]
oikome-core = { path = "../oikome-core" }
oikome-catalog = { path = "../oikome-catalog" }
oikome-connect = { path = "../oikome-connect" }
oikome-engine = { path = "../oikome-engine" }
oikome-engine-duckdb = { path = "../oikome-engine-duckdb", optional = true }
oikome-engine-sqlite = { path = "../oikome-engine-sqlite", optional = true }
oikome-federation = { path = "../oikome-federation" }
oikome-identity = { path = "../oikome-identity" }
oikome-network = { path = "../oikome-network" }
oikome-semantic = { path = "../oikome-semantic" }
oikome-storage = { path = "../oikome-storage" }
oikome-vfs = { path = "../oikome-vfs" }
arrow-array = { workspace = true }
arrow-cast = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
iceberg = { workspace = true }
image = { workspace = true }
parquet = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlparser = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
zeroize = { workspace = true }
# The OS keychain for storage credentials (secrets.rs); pinned with the
# platform stores below.
keyring-core = "=1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[dev-dependencies]
async-trait = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = { workspace = true }
# A WebDAV server standing in for a NAS in tests/storage.rs.
dav-server = "0.11"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile = { workspace = true }
