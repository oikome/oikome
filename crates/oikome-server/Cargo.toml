[package]
name = "oikome-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Oikome node server: the Arrow Flight endpoint peers query, and the oikome binary"

[[bin]]
name = "oikome"
path = "src/main.rs"

[dependencies]
oikome-api = { path = "../oikome-api" }
oikome-catalog = { path = "../oikome-catalog" }
oikome-core = { path = "../oikome-core" }
oikome-discovery = { path = "../oikome-discovery" }
oikome-engine = { path = "../oikome-engine" }
oikome-engine-duckdb = { path = "../oikome-engine-duckdb" }
oikome-identity = { path = "../oikome-identity" }
oikome-network = { path = "../oikome-network" }
oikome-node = { path = "../oikome-node" }
oikome-webrtc = { path = "../oikome-webrtc" }
oikome-semantic = { path = "../oikome-semantic" }
arrow-array = { workspace = true }
arrow-cast = { workspace = true }
arrow-flight = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
iceberg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
