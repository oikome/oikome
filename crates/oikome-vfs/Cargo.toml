[package]
name = "oikome-vfs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Without default features: they bring rustls with aws-lc, beside the ring
# the rest of the node uses. TLS here is rustls with ring, installed before
# the first request (`remote::ready`).
opendal = { version = "0.59.5", default-features = false, features = [
    "executors-tokio",
    "http-transport-reqwest-rustls-no-provider",
    "services-fs",
    "services-gdrive",
    "services-s3",
    "services-webdav",
] }
# opendal's HTTP transport, installed by hand: its own installer is behind
# the default features.
opendal-http-transport-reqwest = { version = "0.59.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { workspace = true }
# Streamed WebDAV uploads (opendal sends a WebDAV file as one request body);
# the reqwest iceberg already brings, with ring.
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
thiserror = { workspace = true }
url = "2"
zeroize = { workspace = true }
# PKCE's S256 challenge, signing in to Google Drive (google.rs).
sha2 = { workspace = true }
# Client-side encryption of files on a storage (seal.rs).
base64 = { workspace = true }
blake3 = { workspace = true }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = { workspace = true }
tokio = { workspace = true, features = ["full"] }
iceberg = { workspace = true }
serde = { workspace = true }
typetag = "0.2"
bytes = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-test = { workspace = true }
